[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

# SPA fallback: Vue Router (createWebHistory) precisa que todas as rotas
# sirvam o index.html, senão /dash, /home etc. dão 404 no acesso direto/refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
